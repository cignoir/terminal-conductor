[workspace]
resolver = "2"
members = ["src-tauri", "crates/tc-core"]
exclude = ["vendor"]

# portable-pty with one change: it asks conpty for grapheme-based glyph
# widths. See vendor/README.md.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
